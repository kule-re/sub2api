name: Hajimi Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hajimi-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-backend:
    if: github.repository == 'kule-re/sub2api' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make test-unit
        working-directory: backend
      - run: go test ./...
        working-directory: tools/workbuddy-setup

  verify-frontend:
    if: github.repository == 'kule-re/sub2api' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: make test-frontend

  verify-deploy:
    if: github.repository == 'kule-re/sub2api' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash -n deploy/hajimi-deploy.sh
      - run: python3 -B -m unittest discover -s deploy/tests -p 'test_hajimi_deploy.py'

  build:
    needs: [verify-backend, verify-frontend, verify-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/kule-re/hajimi" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the complete application
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hajimi-amd64
          cache-to: type=gha,mode=max,scope=hajimi-amd64

  deploy:
    needs: build
    if: vars.HAJIMI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hajimi
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Skip an obsolete dev commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'dev has a newer commit; this image will not be deployed.'
          fi
      - name: Back up and update the existing server
        if: steps.current.outputs.deploy == 'true'
        env:
          HAJIMI_HOST: ${{ secrets.HAJIMI_SSH_HOST }}
          HAJIMI_PRIVATE_KEY: ${{ secrets.HAJIMI_SSH_PRIVATE_KEY }}
          HAJIMI_KNOWN_HOSTS: ${{ secrets.HAJIMI_SSH_KNOWN_HOSTS }}
          HAJIMI_PORT: ${{ vars.HAJIMI_SSH_PORT || '35169' }}
          HAJIMI_USER: ${{ vars.HAJIMI_SSH_USER || 'root' }}
          HAJIMI_DIRECTORY: /opt/sub2api
          HAJIMI_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          HAJIMI_REGISTRY_USER: ${{ github.actor }}
          HAJIMI_REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$HAJIMI_HOST" =~ ^[A-Za-z0-9.-]+$ && "$HAJIMI_PORT" =~ ^[0-9]+$ && "$HAJIMI_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$HAJIMI_PRIVATE_KEY" && -n "$HAJIMI_KNOWN_HOSTS" ]]
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/hajimi-ssh.XXXXXXXX")
          remote_script=
          target="$HAJIMI_USER@$HAJIMI_HOST"
          options=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          cleanup() {
            if [[ -n "$remote_script" ]]; then
              ssh "${options[@]}" -p "$HAJIMI_PORT" "$target" "rm -f -- '$remote_script'" || true
            fi
            rm -rf -- "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$HAJIMI_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$HAJIMI_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          candidate_remote=$(ssh "${options[@]}" -p "$HAJIMI_PORT" "$target" 'umask 077; mktemp /tmp/hajimi-deploy.XXXXXXXX.sh')
          [[ "$candidate_remote" =~ ^/tmp/hajimi-deploy\.[A-Za-z0-9]+\.sh$ ]]
          remote_script=$candidate_remote
          scp "${options[@]}" -P "$HAJIMI_PORT" deploy/hajimi-deploy.sh "$target:$remote_script"
          printf -v command 'bash %q %q %q %q' "$remote_script" "$HAJIMI_DIRECTORY" "$HAJIMI_IMAGE" "$HAJIMI_REGISTRY_USER"
          printf '%s\n' "$HAJIMI_REGISTRY_TOKEN" | ssh "${options[@]}" -p "$HAJIMI_PORT" "$target" "$command"
